<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <link rel="stylesheet" href="style-add-publication.css">

    </head>
    <body>
        <div class="main-container py-5">
            <div class="form-card">
                <h4 class="text-center mb-4">Post a New Rent</h4>
                <form action="process-add.php" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" placeholder="What are you renting?" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Describe the item..."></textarea>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Price (DA)</label>
                            <input type="number" name="price" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Per (Hour/Day)</label>
                            <select name="period" class="form-control">
                                <option value="hour">Hour</option>
                                <option value="day">Day</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" placeholder="05/06/07..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" name="address" class="form-control" placeholder="City, Location" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Main Picture</label>
                        <input type="file" name="main_image" id="mainImageInput" class="form-control" accept="image/*" required>
                        <div id="imagePreviewContainer" class="mt-3" style="display:none;">
                            <img id="imagePreview" src="" alt="Preview" class="img-thumbnail" style="max-height: 200px;">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Gallery Pictures (Max 4)</label>
                        <input type="file" name="gallery[]" class="form-control" accept="image/*" multiple>
                    </div>
                    <button type="submit" class="btn submit-btn w-100">PUBLISH NOW</button>
                </form>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script>
            $(document).ready(function() {
                
                // 1. Instant Image Preview Logic
                $("#mainImageInput").change(function() {
                    const file = this.files[0];
                    if (file) {
                        let reader = new FileReader();
                        reader.onload = function(event) {
                            $("#imagePreview").attr("src", event.target.result);
                            $("#imagePreviewContainer").fadeIn(); // Smooth jQuery fade in
                        }
                        reader.readAsDataURL(file);
                    }
                });

                // 2. Client-Side Validation
                $("#pubForm").on("submit", function(e) {
                    let price = parseFloat($("input[name='price']").val());
                    let phone = $("input[name='phone']").val();
                    
                    // Validate Price
                    if (price < 0) {
                        e.preventDefault(); // Stop PHP submission
                        alert("Error: Price cannot be negative.");
                        $("input[name='price']").focus();
                        return;
                    }

                    // Simple Phone Validation (Must contain at least 8 digits)
                    // Removes spaces/dashes before checking length
                    if (phone.replace(/[^0-9]/g, '').length < 8) {
                        e.preventDefault();
                        alert("Error: Please enter a valid phone number.");
                        $("input[name='phone']").focus();
                        return;
                    }
                });
            });
        </script>
    </body>
</html>

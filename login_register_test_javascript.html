<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style_login_register_test_javascript.css">
</head>
<body class="d-flex justify-content-center align-items-center">

    <div class="main-container">
        <header class="top-banner"><div class="banner-logo"><img src="./Assets/logo-sahla-webapp-text-bold.png" alt="sahla" height="180" width="180" ></div></header>
        <div class="toggle-group">
            <div id="login-btn" class="toggle-btn login-label active" onclick="switchForm('login')">Login</div>
            <div id="register-btn" class="toggle-btn register-label" onclick="switchForm('register')">Register</div>
        </div>

        <div class="form-card">
            <div id="login-section" class="form-section active">
                <div id="login-feedback" class="alert d-none mb-3" style="border-radius: 25px;"></div>
                <div id="loginGeneralError" class="alert alert-danger d-none mb-4" style="border-radius: 25px; font-size: 0.9rem;"></div>

                <h4 class="text-center mb-5">Login</h4>
                <form id="loginForm">
                    <div class="mb-4 d-flex align-items-center">
                        <label class="form-label me-3">E-mail:</label>
                        <input name=login-email id="loginEmail" type="email" class="form-control flex-grow-1" placeholder="Write Your E-mail Here" required>
                    </div>

                    <div class="mb-4 d-flex align-items-center">
                        <label class="form-label me-3">Password:</label>
                        <div class="position-relative flex-grow-1">
                            <input name=login-password type="password" id="loginPassword" class="form-control" placeholder="Write Your Password Here" required>
                            <i class="fas fa-eye toggle-password-icon" onclick="togglePassword('loginPassword', this)"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn submit-btn w-100">LOGIN</button>
                </form>
            </div>

            <div id="register-section" class="form-section">
                <div id="register-feedback" class="alert d-none mb-3" style="border-radius: 25px;"></div>

                <h4 class="text-center mb-5">Register</h4>
                <form id="registerForm">
                    <div class="mb-4 d-flex align-items-center">
                        <label class="form-label me-3">Full Name:</label>
                        <input type="text" name="register-fullname" class="form-control flex-grow-1" placeholder="Your full name" required>
                    </div>

                    <div class="mb-4 d-flex align-items-center">
                        <label class="form-label me-3">E-mail:</label>
                        <input type="email" name="register-email" id="regEmail" class="form-control flex-grow-1" placeholder="example@mail.com" required>
                    </div>
                    <div id="emailError" class="error-msg">Please enter a valid email address.</div>

                    <div class="mb-4 d-flex align-items-center">
                         <label class="form-label me-3">Password:</label>
                           <div class="position-relative flex-grow-1">
                               <input name=register-password type="password" id="regPassword" class="form-control" placeholder="Create Your Password Here" required>
                                  <i class="fas fa-eye toggle-password-icon" onclick="togglePassword('regPassword', this)"></i>
                           </div>
                    </div>
                    <div id="passwordError" class="error-msg">Password must be at least 8 characters long.</div>

                    <div class="mb-4 d-flex align-items-center">
                         <label class="form-label me-3">Confirm:</label>
                          <div class="position-relative flex-grow-1">
                                <input name=confirm-register-password type="password" id="confirmPassword" class="form-control" placeholder="Repeat Your Password" required>
                                   <i class="fas fa-eye toggle-password-icon" onclick="togglePassword('confirmPassword', this)"></i>
                          </div>
                    </div>
                    <div id="confirmError" class="error-msg">Passwords do not match.</div>
                                   
 
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label" for="terms" style="font-size: 0.8rem;">
                              I Agree to the Terms & Conditions
                        </label>
                    </div>
                    <button type="submit" class="btn submit-btn w-100">REGISTER</button>
                </form>
            </div>
        </div>
    <footer class="app-footer">2026 &copy; Made With ❤️ By SAHLA TEAM</footer>
    </div>
    <script>
        // --- Helper function to show messages ---
        function displayFeedback(elementId, message, isSuccess) {
            const feedback = document.getElementById(elementId);
            feedback.textContent = message;
            feedback.classList.remove('d-none', 'alert-danger', 'alert-success');
            feedback.classList.add(isSuccess ? 'alert-success' : 'alert-danger');
            
            // Auto-hide error after 5 seconds, keep success visible
            if (!isSuccess) {
                setTimeout(() => feedback.classList.add('d-none'), 5000);
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            const logForm = document.getElementById('loginForm');
            if(logForm) {
                logForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const email = document.getElementById('loginEmail');
                const password = document.getElementById('loginPassword');
                const errorDiv = document.getElementById('loginGeneralError');

                // 1. Quick Frontend Validation
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(email.value) || password.value.length < 8) {
                    errorDiv.textContent = "Please enter a valid email and password (min 8 characters).";
                    errorDiv.classList.remove('d-none');
                    return;
                }

                // 2. AJAX Request
                const formData = new FormData(this);
                const feedbackId = 'login-feedback';

                fetch('login.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.text())
                .then(data => {
                    const result = data.trim();
                    if (result === 'success') {
                        displayFeedback(feedbackId, 'Login successful! Redirecting...', true);
                        window.location.href = 'dashboard.php';
                    } else if (result === 'invalid_password') {
                        displayFeedback(feedbackId, 'Incorrect password. Please try again.', false);
                    } else if (result === 'user_not_found') {
                        displayFeedback(feedbackId, 'No account found with that email.', false);
                    } else {
                        displayFeedback(feedbackId, 'An unexpected error occurred.', false);
                    }
                })
                .catch(error => { displayFeedback(feedbackId, 'Connection failed.', false) });
            });
            } else {console.error("Could not find the loginForm ID in the HTML!");}
        });



        document.addEventListener('DOMContentLoaded', function() {
            const regForm = document.getElementById('registerForm');
            if(regForm) {
                regForm.addEventListener('submit', function(e) {
                    e.preventDefault(); // Stop form from submitting immediately

                    // 1. Get Values
                    const email = document.getElementById('regEmail');
                    const password = document.getElementById('regPassword');
                    const confirmPassword = document.getElementById('confirmPassword');
                    
                    // 2. Reset visual states
                    resetValidation();

                    let isValid = true;

                    // 3. E-mail Format Validation (Regex)
                    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailPattern.test(email.value)) {
                        showError(email, 'emailError');
                        isValid = false;
                    }

                    // 4. Password Length Validation (> 8 characters)
                    if (password.value.length < 8) {
                        showError(password, 'passwordError');
                        isValid = false;
                    }

                    // 5. Confirm Password Validation
                    if (password.value !== confirmPassword.value) {
                        showError(confirmPassword, 'confirmError');
                        isValid = false;
                    }

                    // 6. If all checks pass, proceed to AJAX
                    if (isValid) {
                        const formData = new FormData(this);
                        const feedbackId = 'register-feedback';

                        fetch('register.php', {
                        method: 'POST',
                        body: formData
                        })
                        .then(response => response.text())
                        .then(data => {
                            if (data.trim() === 'success') {
                                displayFeedback(feedbackId, 'Account created! Switching to login...', true);
                                setTimeout(() => {
                                    this.reset(); // Clear the form
                                    switchForm('login'); // Move user to login view
                                    document.getElementById(feedbackId).classList.add('d-none');
                                }, 2000);
                            } else {
                                displayFeedback(feedbackId, data, false);
                            }
                        })
                        .catch(error => displayFeedback(feedbackId, 'Server error. Try again later.', false));
                        console.log("Validation passed! Sending data...");
                    }
                });
            } else {console.error("Could not find the registerForm ID in the HTML!");}
        });

        // Helper function to show errors
        function showError(inputElement, errorId) {
            inputElement.classList.add('is-invalid');
            document.getElementById(errorId).style.display = 'block';
        }

        // Helper function to clear previous errors
        function resetValidation() {
            const inputs = document.querySelectorAll('#registerForm .form-control');
            const errors = document.querySelectorAll('.error-msg');
            
            inputs.forEach(input => input.classList.remove('is-invalid'));
            errors.forEach(err => err.style.display = 'none');
        }
        function switchForm(type) {
            const loginBtn = document.getElementById('login-btn');
            const registerBtn = document.getElementById('register-btn');
            const loginSection = document.getElementById('login-section');
            const registerSection = document.getElementById('register-section');

            if (type === 'login') {
                loginSection.classList.add('active');
                registerSection.classList.remove('active');
                loginBtn.classList.add('active');
                registerBtn.classList.remove('active');
            } else {
                registerSection.classList.add('active');
                loginSection.classList.remove('active');
                registerBtn.classList.add('active');
                loginBtn.classList.remove('active');
            }
        }
        function togglePassword(inputId, icon) {
            const passwordInput = document.getElementById(inputId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                 icon.classList.remove('fa-eye');
                  icon.classList.add('fa-eye-slash');
                 } else {
                     passwordInput.type = 'password';
                     icon.classList.remove('fa-eye-slash');
                      icon.classList.add('fa-eye');
                    }
}
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
